<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan the QR Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1c1917 0%, #090a0f 75%);
      color: #f5ebd6;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .poster {
      max-width: 520px;
      width: 100%;
      background: rgba(18, 16, 22, 0.94);
      border: 2px solid rgba(212, 175, 55, 0.6);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85);
    }
    h1 {
      font-size: 2.1rem;
      letter-spacing: 1px;
      color: #f5d061;
      margin-bottom: 28px;
    }
    .qr-box {
      background: #ffffff;
      padding: 18px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 26px;
      box-shadow: 0 0 35px rgba(245, 208, 97, 0.25);
    }
    .qr-box img {
      display: block;
      width: 280px;
      height: 280px;
    }
    .steps {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.15rem;
      line-height: 1.55;
      color: #e8e0cf;
    }
  </style>
</head>
<body>
  <div class="poster">
    <h1>Scan the QR code</h1>
    <div class="qr-box">
      <img id="qr-img" alt="Scan to Begin" />
    </div>
    <p class="steps">
      Scan with your phone camera to begin the 5-stop AR voyage across the Mediterranean Sea.
    </p>
  </div>
  <script>
    const targetUrl = 'https://arvind0sundararajan.github.io/odyssey/';
    document.getElementById('qr-img').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=560x560&margin=8&data=' +
      encodeURIComponent(targetUrl);
  </script>
</body>
</html>
